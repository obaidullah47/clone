name: myapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # ✅ Assets added here
  assets:
    - assets/

  fonts:
    - family: Inter
      fonts:
        - asset: fonts/interRegular.ttf
          weight: 400
        - asset: fonts/interMedium.ttf
          weight: 500

    - family: Josefin Sans
      fonts:
        - asset: fonts/JosefinSansRegular.ttf
          weight: 400
        - asset: fonts/JosefinSansMedium.ttf
          weight: 500
        - asset: fonts/JosefinSansBold.ttf
          weight: 700